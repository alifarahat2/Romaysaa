<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روميساء ❤️ 10/4/2026</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #160910;
    background-image: 
      linear-gradient(rgba(255, 111, 145, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 111, 145, 0.08) 1px, transparent 1px),
      radial-gradient(circle at center, #2d111e 0%, #11060b 100%);
    background-size: 45px 45px, 45px 45px, 100% 100%;
    color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  .glow-circle {
    position: fixed;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(255, 94, 132, 0.22) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 540px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    animation: fadeIn 1.2s ease-out;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255, 200, 110, 0.35);
    background: rgba(35, 15, 24, 0.75);
    color: #f6d388;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 0 20px rgba(246, 211, 136, 0.12);
  }

  .name-title {
    font-size: clamp(2.8rem, 8vw, 4.2rem);
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 4px 25px rgba(255, 107, 139, 0.45);
    line-height: 1.2;
  }

  .date-pill {
    font-size: 1.25rem;
    font-weight: 700;
    color: #ff8fa8;
    background: rgba(255, 107, 139, 0.12);
    border: 1px solid rgba(255, 107, 139, 0.35);
    padding: 8px 26px;
    border-radius: 16px;
    letter-spacing: 2px;
    direction: ltr;
  }

  .message-card {
    background: rgba(38, 15, 26, 0.72);
    border: 1px solid rgba(255, 122, 150, 0.3);
    border-radius: 24px;
    padding: 32px 26px;
    width: 100%;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45), inset 0 0 20px rgba(255, 107, 139, 0.08);
    backdrop-filter: blur(8px);
  }

  .main-message {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700;
    color: #ffe3e9;
    line-height: 1.6;
    text-shadow: 0 2px 15px rgba(255, 111, 145, 0.4);
  }

  .hearts-divider {
    margin-top: 14px;
    font-size: 1.2rem;
    color: #ff6b8b;
    letter-spacing: 6px;
  }

  .audio-controls {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .music-btn {
    background: linear-gradient(135deg, #ff6b8b 0%, #ff477e 100%);
    color: #ffffff;
    border: none;
    padding: 13px 30px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 71, 126, 0.45);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .music-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(255, 71, 126, 0.65);
  }

  .music-note {
    font-size: 0.82rem;
    color: rgba(255, 255, 255, 0.6);
  }

  .floating-heart {
    position: fixed;
    bottom: -30px;
    color: rgba(255, 107, 139, 0.45);
    font-size: 18px;
    pointer-events: none;
    animation: floatUp linear infinite;
    z-index: 1;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(0.8);
      opacity: 0;
    }
    20% {
      opacity: 0.8;
    }
    100% {
      transform: translateY(-110vh) scale(1.3);
      opacity: 0;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="glow-circle"></div>

  <div class="container">
    <div class="badge">I Love You 💛</div>

    <h1 class="name-title">روميساء</h1>

    <div class="date-pill">10 / 4 / 2026</div>

    <div class="message-card">
      <p class="main-message">بحبك ي نور عيني ❤️</p>
      <div class="hearts-divider">♥ • ♥ • ♥</div>
    </div>

    <div class="audio-controls">
      <button id="musicToggle" class="music-btn" onclick="toggleAudio()">
        <span id="btnIcon">🎵</span>
        <span id="btnText">تشغيل / إيقاف الموسيقى</span>
      </button>
      <span class="music-note">ضعي ملف الأغنية باسم song.mp3 بجانب هذا الملف لتعمل تلقائياً</span>
    </div>
  </div>

  <!-- ضع ملف الأغنية المفضلة بنفس الاسم song.mp3 في نفس المجلد -->
  <audio id="bgMusic" src="song.mp3" autoplay loop playsinline></audio>

  <script>
    const audio = document.getElementById('bgMusic');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');

    function updateButton() {
      if (!audio.paused) {
        btnIcon.textContent = '⏸️';
        btnText.textContent = 'الموسيقى تعمل الآن';
      } else {
        btnIcon.textContent = '▶️';
        btnText.textContent = 'اضغطي لتشغيل الأغنية';
      }
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(updateButton).catch(() => {});
      } else {
        audio.pause();
        updateButton();
      }
    }

    // محاولة التشغيل التلقائي فور فتح الصفحة أو عند أول لمسة للشاشة
    window.addEventListener('DOMContentLoaded', () => {
      audio.play().then(updateButton).catch(() => {
        updateButton();
        const startOnInteract = () => {
          audio.play().then(updateButton).catch(() => {});
          document.removeEventListener('click', startOnInteract);
          document.removeEventListener('touchstart', startOnInteract);
        };
        document.addEventListener('click', startOnInteract);
        document.addEventListener('touchstart', startOnInteract);
      });
    });

    // قلوب متحركة في الخلفية
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = Math.random() > 0.5 ? '♥' : '💛';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 14 + 12) + 'px';
      heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 11000);
    }
    setInterval(createHeart, 700);
  </script>

</body>
</html>
